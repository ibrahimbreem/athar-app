name: athar
description: منصة أثر - منصة خيرية تربط المتبرعين بالمنظمات الخيرية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.8.0

  # HTTP (for Cloudinary upload)
  http: ^1.2.0

  # UI & Typography
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Media & Files
  image_picker: ^1.0.7

  # Utilities
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  share_plus: ^7.2.2
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.4.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
